name: bluebubbles
description: BlueBubbles is a standalone Flutter messaging interface for Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path_android: assets/icon/bluebubbles-rounded.png
  min_sdk_android: 21
