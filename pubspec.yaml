name: bluebubbles
description: BlueBubbles is a standalone Flutter messaging interface for Android.
publish_to: none
version: 0.1.0+5

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  audioplayers: 6.6.0
  characters: ^1.3.0
  cross_file: ^0.3.4+2
  file_picker: ^8.1.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  path: ^1.9.0
  share_plus: ^10.1.4
  shared_preferences: ^2.3.5
  sqflite: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/photos/
    - assets/sounds/
  fonts:
    - family: SF Pro Text
      fonts:
        - asset: assets/fonts/SF-Pro-Text-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Text-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Text-Bold.otf
          weight: 700
        - asset: assets/fonts/SF-Pro-Text-Heavy.otf
          weight: 800
        - asset: assets/fonts/SF-Pro-Text-Black.otf
          weight: 900
    - family: Apple Color Emoji
      fonts:
        - asset: assets/fonts/AppleColorEmoji.ttf

flutter_launcher_icons:
  android: "launcher_icon_v5"
  ios: false
  image_path_android: assets/icon/bluebubbles-circle.png
  adaptive_icon_background: assets/icon/bluebubbles-square.png
  adaptive_icon_foreground: assets/icon/transparent-foreground.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
